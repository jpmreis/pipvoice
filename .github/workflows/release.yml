# Tagged release: build the firmware for every board from the clean tag,
# package the flash bundles + one manifest, publish a GitHub Release.
# Servers ingest the release from the admin Firmware page
# (server/app/release.py) and then serve the binaries same-origin to
# their own web flasher and OTA — the manifest is never fetched by
# browsers, so GitHub's missing CORS headers on release assets don't
# matter.
#
# Tag v<version> must match PROJECT_VER in firmware/CMakeLists.txt
# (one version number for firmware + server + PWA; one tag ships one
# build per board). Boards build on different IDF majors on purpose:
# the 1.8 stays on 5.4.x (ES8311 mic-silence regression on 5.5), the
# 1.75b/2.16 BSPs only exist for >=5.5.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # dry run: builds + packages, publishes nothing

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version (tag must match PROJECT_VER)
        id: ver
        run: |
          PV=$(sed -n 's/.*set(PROJECT_VER "\(.*\)").*/\1/p' firmware/CMakeLists.txt)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
            if [ "$VER" != "$PV" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match PROJECT_VER $PV"
              exit 1
            fi
          else
            VER="$PV"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: amoled-1.8
            idf: v5.4.4
          - board: amoled-1.75b
            idf: v5.5.5
          - board: amoled-2.16
            idf: v5.5.5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware (${{ matrix.board }}, ESP-IDF ${{ matrix.idf }})
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32s3
          path: firmware
          command: idf.py -DPIP_BOARD=${{ matrix.board }} build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.board }}
          path: |
            firmware/build/pip.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Package assets + manifest + notes
        run: |
          python3 firmware/tools/make_manifest.py \
            --version "${{ needs.version.outputs.ver }}" \
            --build amoled-1.8=builds/build-amoled-1.8 \
            --build amoled-1.75b=builds/build-amoled-1.75b \
            --build amoled-2.16=builds/build-amoled-2.16 \
            --changelog CHANGELOG.md --out dist

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/pip-*.bin
            dist/manifest.json

      - name: Upload dry-run artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: pip-${{ needs.version.outputs.ver }}-dryrun
          path: dist/
