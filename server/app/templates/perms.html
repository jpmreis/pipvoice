{% extends "base.html" %}{% block content %}
<h1>Permissions</h1>
<p class="muted">Pick a person, then tap who they talk with. Pairs are
always two-way. Nothing changes until you save.</p>

<style>
.permwrap{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start}
@media(max-width:640px){.permwrap{grid-template-columns:1fr}}
.plist{background:var(--card);border-radius:14px;padding:8px;margin:14px 0}
.pperson{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;border-radius:10px;padding:10px 12px;margin:0;
  color:var(--tx);font-size:15px;cursor:pointer}
.pperson:hover{background:var(--card2)}
.pperson.sel{background:var(--card2);font-weight:600}
.pperson .cnt{margin-left:auto;color:var(--dim);font-size:13px}
.pperson.sel .cnt{color:var(--acc)}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:12px;margin-top:12px}
.ptile{display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--card2);border:2px solid transparent;border-radius:14px;
  padding:14px 6px 10px;margin:0;cursor:pointer;color:var(--dim);font-size:14px;
  font-weight:400}
.ptile .pav{width:52px;height:52px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:22px;font-weight:600;
  color:#000;opacity:.3;position:relative}
.ptile.on{border-color:var(--acc);color:var(--tx)}
.ptile.on .pav{opacity:1}
.ptile .pav .tick{position:absolute;top:-6px;right:-6px;width:20px;height:20px;
  border-radius:50%;background:var(--acc);color:#000;font-size:13px;
  font-weight:700;display:none;align-items:center;justify-content:center}
.ptile.on .pav .tick{display:flex}
.ptname{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savebar{display:flex;align-items:center;gap:14px;margin-top:14px}
.savebar .note{color:var(--dim);font-size:14px}
.savebar .note.dirty{color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
</style>

<div class="permwrap">
  <div class="plist" id="plist"></div>
  <div class="card" style="margin:14px 0">
    <h2 id="ptitle" style="margin-top:0"></h2>
    <div class="ptiles" id="ptiles"></div>
  </div>
</div>

<form method="post" id="pform" class="savebar">
  <button id="psave" disabled>Save changes</button>
  <span class="note" id="pnote">No changes</span>
</form>

<script>
const USERS = {{ users | tojson }};
const pairs = new Set({{ pairs | tojson }}.map(p => p.join("_")));
const saved = new Set(pairs);
let sel = USERS.length ? USERS[0].id : null;

const key = (a, b) => (a < b ? a + "_" + b : b + "_" + a);
const byId = Object.fromEntries(USERS.map(u => [u.id, u]));
const count = id => USERS.reduce((n, u) =>
  n + (u.id !== id && pairs.has(key(id, u.id)) ? 1 : 0), 0);
const dirty = () => pairs.size !== saved.size ||
  [...pairs].some(k => !saved.has(k));

function renderList() {
  const el = document.getElementById("plist");
  el.replaceChildren(...USERS.map(u => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pperson" + (u.id === sel ? " sel" : "");
    b.innerHTML = `<span class="dot" style="background:#${u.color}"></span>` +
      `<span></span><span class="cnt">${count(u.id)}</span>`;
    b.children[1].textContent = u.display_name;
    b.onclick = () => { sel = u.id; render(); };
    return b;
  }));
}

function renderTiles() {
  const me = byId[sel];
  const t = document.getElementById("ptitle");
  t.textContent = me ? me.display_name + " talks with" : "";
  const el = document.getElementById("ptiles");
  el.replaceChildren(...USERS.filter(u => u.id !== sel).map(u => {
    const k = key(sel, u.id);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ptile" + (pairs.has(k) ? " on" : "");
    b.innerHTML = `<span class="pav" style="background:#${u.color}">` +
      `<span></span><span class="tick">&#10003;</span></span>` +
      `<span class="ptname"></span>`;
    b.querySelector(".pav > span").textContent =
      (u.display_name || "?")[0].toUpperCase();
    b.querySelector(".ptname").textContent = u.display_name;
    b.onclick = () => { pairs.has(k) ? pairs.delete(k) : pairs.add(k); render(); };
    return b;
  }));
}

function render() {
  renderList(); renderTiles();
  const d = dirty();
  document.getElementById("psave").disabled = !d;
  const note = document.getElementById("pnote");
  note.textContent = d ? "Unsaved changes" : "No changes";
  note.className = "note" + (d ? " dirty" : "");
}

document.getElementById("pform").onsubmit = () => {
  const f = document.getElementById("pform");
  for (const k of pairs) {
    const i = document.createElement("input");
    i.type = "hidden"; i.name = "p_" + k; i.value = "on";
    f.appendChild(i);
  }
  window.onbeforeunload = null;
};
window.onbeforeunload = () => dirty() ? "unsaved" : null;
render();
</script>
{% endblock %}
