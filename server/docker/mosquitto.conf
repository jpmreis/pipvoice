# Mosquitto for the Docker stack. Auth files are shared with the app
# container (it rewrites them on device provisioning); the entrypoint
# script HUPs the broker when they change.
per_listener_settings false
allow_anonymous false
password_file /mosquitto-auth/passwd
acl_file /mosquitto-auth/acl

# retained firmware notifies must survive broker restarts
persistence true
persistence_location /mosquitto/data/

# app <-> broker, compose network only (port not published)
listener 1883

# devices, TLS with the cert borrowed from Caddy
listener 8883
certfile /mosquitto-certs/server.crt
keyfile /mosquitto-certs/server.key
