version: "0.1.0"
# amoled-2.16 (square). Selected by CMake: the project CMakeLists copies
# idf_component.<PIP_BOARD>.yml over the gitignored idf_component.yml at
# configure time (the three Waveshare BSPs export identically named
# headers, so only one can be in a build).
dependencies:
  idf: ">=5.5"   # every release of this BSP needs 5.5
  waveshare/esp32_s3_touch_amoled_2_16: "^2.0.1"  # CO5300+CST9220+ES8311/ES7210
  joltwallet/littlefs: "^1.14.0"
  lvgl/lvgl: "^9.2.0"
  # voice control: TFLite-Micro (wake-word inference) + the micro-speech
  # feature frontend the microWakeWord models were trained against.
  # ~1.3.3 matches the pairing ESPHome ships in production.
  espressif/esp-tflite-micro: "~1.3.3"
  esphome/esp-micro-speech-features: "^1.2.3"
